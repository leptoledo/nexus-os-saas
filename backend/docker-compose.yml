version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app   # mount for local dev; remove in prod
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level debug

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app.celery_app worker
        --loglevel=info
        --concurrency=4
        -Q default,email,reports,ai,social,whatsapp,monitoring

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app.celery_app beat
        --loglevel=info

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - worker
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app.celery_app flower
        --port=5555

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
