name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        working-directory: backend
        env:
          ENVIRONMENT: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  test-frontend:
    name: Test Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx next lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  lint-sql:
    name: Lint SQL Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SQL migration files
        run: |
          echo "Checking for SQL syntax issues in migrations..."
          find supabase/migrations -name "*.sql" | while read file; do
            echo "Checking: $file"
            # Verifica se o ficheiro não está vazio
            if [ ! -s "$file" ]; then
              echo "ERROR: Empty migration file: $file"
              exit 1
            fi
            # Verifica se começa com comentário de versão ou statement válido
            if ! head -1 "$file" | grep -qE "^(--|CREATE|ALTER|DROP|INSERT|UPDATE|DELETE|BEGIN|COMMIT|SELECT|DO|\s*)"; then
              echo "WARNING: Unexpected start in $file"
            fi
          done
          echo "SQL validation complete."

      - name: Check migration naming convention
        run: |
          find supabase/migrations -name "*.sql" | while read file; do
            basename=$(basename "$file")
            if ! echo "$basename" | grep -qE "^[0-9]{14}_[a-z_]+\.sql$"; then
              echo "WARNING: Migration file does not follow naming convention (YYYYMMDDHHMMSS_name.sql): $basename"
            fi
          done
